name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required for sbom-action to attach SBOMs to release assets
  packages: write
  id-token: write   # cosign keyless OIDC
  attestations: write

jobs:
  # Publish all three workspace wheels (decepticon-core, decepticon,
  # decepticon-sdk) to PyPI via Trusted Publishing (OIDC). Lockstep
  # release per spec §13.1 — all three share one version string and
  # publish in one job so the dependency closure is consistent.
  #
  # PyPI side requires a Trusted Publisher config per project on
  # pypi.org before the first successful publish:
  #   - decepticon-core  -> repo BitterSecurity/Decepticon, workflow release.yml
  #   - decepticon       -> same
  #   - decepticon-sdk   -> same
  # See: https://docs.pypi.org/trusted-publishers/
  publish-pypi:
    name: Publish three workspace wheels to PyPI
    if: github.repository == 'BitterSecurity/Decepticon'
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) — no API token
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.8.15"

      - name: Stamp version from the tag across the workspace
        run: |
          version="${GITHUB_REF_NAME#v}"
          # All four pyprojects share one version string per spec §13.1
          # (lockstep release). Root umbrella stays at the sentinel since
          # it doesn't ship as a wheel, but stamping it keeps uv build
          # invariants happy.
          sed -i 's/^version = "[^"]*"/version = "'"$version"'"/' \
              pyproject.toml \
              packages/decepticon-core/pyproject.toml \
              packages/decepticon/pyproject.toml \
              packages/decepticon-sdk/pyproject.toml
          sed -i 's/"decepticon-core"/"decepticon-core=='"$version"'"/' \
              packages/decepticon/pyproject.toml \
              packages/decepticon-sdk/pyproject.toml
          sed -i 's/"decepticon"/"decepticon=='"$version"'"/' \
              packages/decepticon-sdk/pyproject.toml

      - name: Build three workspace wheels + sdists
        run: |
          # uv build --all-packages from the workspace root produces wheel
          # + sdist for every workspace member into ./dist/:
          #   dist/decepticon_core-<v>-py3-none-any.whl  + .tar.gz
          #   dist/decepticon-<v>-py3-none-any.whl       + .tar.gz
          #   dist/decepticon_sdk-<v>-py3-none-any.whl   + .tar.gz
          uv build --all-packages

      - name: Publish to PyPI (all three wheels atomically)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Idempotent re-runs: if a version is already on PyPI (e.g. a
          # partial-failure re-tag after Docker jobs needed to rebuild),
          # skip the upload instead of failing the workflow. PyPI itself
          # still forbids overwriting an existing version's files.
          skip-existing: true
          # ``dist/`` carries wheels + sdists for all three packages — the
          # gh-action-pypi-publish step uploads every artifact found there
          # in one transaction.
          packages-dir: dist

  # Source-tree version fields (pyproject.toml, package.json) carry a "0.0.0"
  # sentinel — the real release version is stamped into images at Docker
  # build time via --build-arg VERSION=<tag>. No pre-tag sync step needed.
  launcher:
    name: Build Go launcher binaries
    if: github.repository == 'BitterSecurity/Decepticon'
    runs-on: ubuntu-latest
    environment: pypi-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Read the toolchain from go.mod (single source of truth) so the
          # release build never drifts from the launcher's declared version.
          go-version-file: clients/launcher/go.mod
          cache-dependency-path: clients/launcher/go.sum

      - name: Run tests
        working-directory: clients/launcher
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
          workdir: clients/launcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configuration-file integrity manifest. The OSS installer and
      # launcher self-update download docker-compose.yml / litellm.yaml /
      # .env.example from raw.githubusercontent.com and used to apply them
      # without any integrity check, which made GitHub-CDN tampering a
      # one-shot RCE vector (the compose file pulls arbitrary images). We
      # publish a sha256sum-format manifest as a release asset; the
      # installer/launcher fetches it from the immutable release URL and
      # verifies every config file against it before writing.
      - name: Generate integrity manifests
        run: |
          set -euo pipefail
          sha256sum docker-compose.yml config/litellm.yaml .env.example > config-checksums.txt
          sha256sum skills/decepticon/SKILL.md skills/decepticon/reference.md skills/decepticon/examples.md > agent-skill-checksums.txt
          cat config-checksums.txt

      - name: Upload integrity manifests to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GoReleaser created the release in draft mode above. --clobber so
          # re-runs of the launcher job (e.g. release-recover) refresh the
          # asset instead of erroring.
          gh release upload "${GITHUB_REF_NAME}" config-checksums.txt agent-skill-checksums.txt --clobber

  # Multi-arch images that build well under QEMU (Python wheels, simple
  # binaries). Sandbox + c2-sliver are split out (docker-heavy) because
  # their Kali base + ~25-package apt layers are too slow under QEMU.
  docker:
    name: Build & push ${{ matrix.image }}
    if: github.repository == 'BitterSecurity/Decepticon'
    runs-on: ubuntu-latest
    environment: pypi-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: decepticon-litellm
            dockerfile: containers/litellm.Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: decepticon-langgraph
            dockerfile: containers/langgraph.Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: decepticon-cli
            dockerfile: containers/cli.Dockerfile
            platforms: linux/amd64,linux/arm64
          # Skillogy server: lean python:3.13-slim (no Kali/heavy apt layers),
          # so multi-arch under QEMU is cheap like cli/langgraph. The compose
          # `skillogy` service has no `profiles:`, so it is ALWAYS started by
          # `decepticon start` — it MUST be published or every start fails to
          # pull ghcr.io/bittersecurity/decepticon-skillogy:<version>.
          - image: decepticon-skillogy
            dockerfile: containers/skillogy.Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Build & push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          # Stamp the package version into images at build time. langgraph +
          # cli Dockerfiles read this ARG to sed-patch pyproject.toml /
          # package.json from the "0.0.0" sentinel; litellm ignores it
          # (no ARG declared) which is harmless.
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # Only publish the version tag here — `:latest` is promoted by the
          # publish-release job AFTER every image has been verified on GHCR,
          # so a half-finished release never updates the moving tag.
          tags: |
            ghcr.io/bittersecurity/${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify shipped CLI package version
        if: matrix.image == 'decepticon-cli'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm --platform linux/amd64 --entrypoint node \
            "ghcr.io/bittersecurity/decepticon-cli:${EXPECTED_VERSION}" \
            -p "require('/app/package.json').version")"
          if [[ "${actual}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::CLI image package version ${actual} does not match ${EXPECTED_VERSION}"
            exit 1
          fi

      - name: Cosign sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/bittersecurity/${{ matrix.image }}@${DIGEST}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/bittersecurity/${{ matrix.image }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json

      # The OCI attestation is always attached to the image. The
      # `--tlog-upload` flag controls whether the entry is also pushed to
      # the public Sigstore Rekor transparency log.
      #
      # decepticon-sandbox: SBOM is ~7 MB (Kali rolling base + full pentest
      # toolchain ⇒ thousands of dpkg components). Rekor's per-entry size
      # cap (~5 MiB) deterministically rejects the upload, so we attach
      # the attestation to the OCI artifact only. Verifiers can still run
      # `cosign verify-attestation` against the registry; only the public
      # transparency-log entry is omitted for this one image.
      #
      # All other images: keep the default Rekor upload, but wrap in a
      # 5-attempt linear backoff to absorb transient Rekor 5xx without
      # blocking the release. Final failure emits a workflow ::warning
      # but does not fail the job — the image is already signed and the
      # SBOM file is uploaded as a release artifact below.
      - name: Attest SBOM with cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -uo pipefail
          target="ghcr.io/bittersecurity/${{ matrix.image }}@${DIGEST}"
          predicate="sbom-${{ matrix.image }}.cdx.json"
          extra=()
          if [ "${{ matrix.image }}" = "decepticon-sandbox" ]; then
            extra+=(--tlog-upload=false)
            echo "decepticon-sandbox: SBOM exceeds Rekor entry size cap; attaching attestation to OCI only (--tlog-upload=false)."
          fi
          for attempt in 1 2 3 4 5; do
            echo "Attestation attempt ${attempt}/5 for ${target}"
            if cosign attest --yes "${extra[@]}" \
                --predicate "${predicate}" \
                --type cyclonedx \
                "${target}"; then
              echo "Attestation succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((30 * attempt))
              echo "Attestation attempt ${attempt} failed; sleeping ${delay}s..."
              sleep "${delay}"
            fi
          done
          echo "::warning title=SBOM attestation skipped::cosign attest failed after 5 retries (Sigstore Rekor unavailable). Image is signed and SBOM artifact uploaded; transparency-log entry for the SBOM is missing and can be re-attested manually."

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json

  # Sandbox + c2-sliver: split per platform onto native runners. These
  # images sit on Kali rolling with heavy apt layers (Python, Node, sliver, ~25 dpkg postinst
  # scripts), which under QEMU emulation pushed sandbox's arm64 build
  # over 25 minutes. Native runners drop it to ~5 min. Per-image,
  # per-platform digests are stitched into a manifest by
  # docker-heavy-merge.
  docker-heavy:
    name: Build & push ${{ matrix.image }} (${{ matrix.platform }})
    if: github.repository == 'BitterSecurity/Decepticon'
    environment: pypi-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: decepticon-sandbox
            dockerfile: containers/sandbox.Dockerfile
            platform: amd64
            runs-on: ubuntu-latest
          - image: decepticon-sandbox
            dockerfile: containers/sandbox.Dockerfile
            platform: arm64
            runs-on: ubuntu-24.04-arm
          - image: decepticon-c2-sliver
            dockerfile: containers/c2-sliver.Dockerfile
            platform: amd64
            runs-on: ubuntu-latest
          - image: decepticon-c2-sliver
            dockerfile: containers/c2-sliver.Dockerfile
            platform: arm64
            runs-on: ubuntu-24.04-arm
          - image: decepticon-rea
            dockerfile: containers/rea.Dockerfile
            platform: amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          provenance: mode=max
          sbom: ${{ matrix.image != 'decepticon-sandbox' }}
          outputs: type=image,name=ghcr.io/bittersecurity/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.image }}-digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per-image manifest assembly. Same retry+warning policy on the SBOM
  # attestation as docker — see that job for context.
  # The sandbox-specific --tlog-upload=false fall-through (Rekor entry
  # size cap on the Kali SBOM) is preserved here too.
  docker-heavy-merge:
    name: Merge ${{ matrix.image }} manifest + sign + SBOM
    if: github.repository == 'BitterSecurity/Decepticon'
    needs: docker-heavy
    strategy:
      fail-fast: false
      matrix:
        image: [decepticon-sandbox, decepticon-c2-sliver, decepticon-rea]
    runs-on: ubuntu-latest
    environment: pypi-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ matrix.image }}-digest-*
          merge-multiple: true

      - name: Create multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-split: one image ref arg per digest file
          docker buildx imagetools create \
            --tag ghcr.io/bittersecurity/${{ matrix.image }}:${{ steps.version.outputs.version }} \
            $(printf 'ghcr.io/bittersecurity/${{ matrix.image }}@sha256:%s ' *)
          digest=$(docker buildx imagetools inspect \
            ghcr.io/bittersecurity/${{ matrix.image }}:${{ steps.version.outputs.version }} \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cosign sign manifest (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/bittersecurity/${{ matrix.image }}@${DIGEST}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/bittersecurity/${{ matrix.image }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json

      - name: Attest SBOM with cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -uo pipefail
          target="ghcr.io/bittersecurity/${{ matrix.image }}@${DIGEST}"
          predicate="sbom-${{ matrix.image }}.cdx.json"
          extra=()
          if [ "${{ matrix.image }}" = "decepticon-sandbox" ]; then
            extra+=(--tlog-upload=false)
            echo "decepticon-sandbox: SBOM exceeds Rekor entry size cap; attaching attestation to OCI only (--tlog-upload=false)."
          fi
          for attempt in 1 2 3 4 5; do
            echo "Attestation attempt ${attempt}/5 for ${target}"
            if cosign attest --yes "${extra[@]}" \
                --predicate "${predicate}" \
                --type cyclonedx \
                "${target}"; then
              echo "Attestation succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((30 * attempt))
              echo "Attestation attempt ${attempt} failed; sleeping ${delay}s..."
              sleep "${delay}"
            fi
          done
          echo "::warning title=SBOM attestation skipped::cosign attest failed after 5 retries (Sigstore Rekor unavailable). Image is signed and SBOM artifact uploaded; transparency-log entry for the SBOM is missing and can be re-attested manually."

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json

  # Atomic release gate. Waits until every Docker image AND the launcher
  # binaries are pushed, verifies each :<version> manifest exists on GHCR,
  # then promotes :<version> → channel tags (:stable for finals, :latest
  # for all) and flips the GitHub release from draft → published. Until
  # this job succeeds:
  #   - GitHub `releases/latest` keeps returning the previous version, so
  #     the launcher's stable channel never points at images mid-push.
  #   - The channel tags are not moved, so a `${DECEPTICON_VERSION:-stable}`
  #     fallback keeps resolving to the previous (working) release.
  publish-release:
    name: Verify images & publish release
    if: github.repository == 'BitterSecurity/Decepticon'
    needs: [launcher, docker, docker-heavy-merge]
    runs-on: ubuntu-latest
    environment: pypi-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify all version-tagged images exist on GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          images=(
            decepticon-litellm
            decepticon-langgraph
            decepticon-sandbox
            decepticon-cli
            decepticon-skillogy
            decepticon-c2-sliver
            decepticon-rea
          )
          for img in "${images[@]}"; do
            ref="ghcr.io/bittersecurity/${img}:${VERSION}"
            echo "Verifying ${ref}"
            docker buildx imagetools inspect "${ref}" >/dev/null
          done

      # Channel tags (Claude-Code-style soak model; see
      # docs/update-channels.md). Both channels are FINAL-only:
      #   :latest — newest FINAL release, moved here immediately on every
      #             final release (this step).
      #   :stable — newest FINAL release that has baked >= the soak window;
      #             moved separately by the scheduled `promote-stable.yml`
      #             workflow, NOT here.
      # Pre-releases move neither tag (the channels never auto-select them).
      - name: Promote :<version> → :latest (final releases only)
        if: steps.version.outputs.prerelease != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          images=(
            decepticon-litellm
            decepticon-langgraph
            decepticon-sandbox
            decepticon-cli
            decepticon-skillogy
            decepticon-c2-sliver
            decepticon-rea
          )
          for img in "${images[@]}"; do
            src="ghcr.io/bittersecurity/${img}:${VERSION}"
            dst="ghcr.io/bittersecurity/${img}:latest"
            echo "Promoting ${src} → ${dst}"
            docker buildx imagetools create --tag "${dst}" "${src}"
          done

      - name: Attach digest-pinned image manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          images=(
            decepticon-litellm
            decepticon-langgraph
            decepticon-sandbox
            decepticon-cli
            decepticon-skillogy
            decepticon-c2-sliver
            decepticon-rea
          )
          : > image-digests.txt
          for img in "${images[@]}"; do
            ref="ghcr.io/bittersecurity/${img}:${VERSION}"
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{.Manifest.Digest}}')"
            [[ "${digest}" =~ ^sha256:[[:xdigit:]]{64}$ ]]
            printf '%s@%s\n' "${ref}" "${digest}" >> image-digests.txt
          done
          gh release upload "v${VERSION}" image-digests.txt --clobber

      - name: Publish GitHub release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.version.outputs.version }}" \
            --draft=false \
            --prerelease=${{ steps.version.outputs.prerelease }}

  # AdverserialAI forks publish digest-pinned amd64 images for confidential
  # runtimes. The upstream release jobs above remain intact and run only in
  # BitterSecurity/Decepticon, so a fork tag cannot publish upstream packages.
  adverserial-prepare:
    name: Prepare Adverserial release
    if: github.repository == 'AdverserialAI/Decepticon'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Decepticon $GITHUB_REF_NAME" --notes "Digest-pinned images for the Adverserial confidential runtime." \
            --draft --verify-tag

  adverserial-image:
    name: Publish Adverserial ${{ matrix.image }}
    if: github.repository == 'AdverserialAI/Decepticon'
    needs: adverserial-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: decepticon-litellm
            dockerfile: containers/litellm.Dockerfile
          - image: decepticon-langgraph
            dockerfile: containers/langgraph.Dockerfile
          - image: decepticon-cli
            dockerfile: containers/cli.Dockerfile
          - image: decepticon-skillogy
            dockerfile: containers/skillogy.Dockerfile
          - image: decepticon-sandbox
            dockerfile: containers/sandbox.Dockerfile
          - image: decepticon-c2-sliver
            dockerfile: containers/c2-sliver.Dockerfile
          - image: decepticon-rea
            dockerfile: containers/rea.Dockerfile
    env:
      IMAGE: us-central1-docker.pkg.dev/adverserial-ack-poc/agents/${{ matrix.image }}
      WORKLOAD_IDENTITY_PROVIDER: projects/711745269151/locations/global/workloadIdentityPools/github-releases/providers/decepticon
      PUBLISHER: artex-release-publisher@adverserial-ack-poc.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: google
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PUBLISHER }}
          token_format: access_token
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.google.outputs.access_token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ steps.version.outputs.number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:git-${{ github.sha }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign image and upload digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "digest-${{ matrix.image }}.txt"
          gh release upload "$GITHUB_REF_NAME" "digest-${{ matrix.image }}.txt" --clobber

  adverserial-publish:
    name: Publish Adverserial release
    if: github.repository == 'AdverserialAI/Decepticon'
    needs: [adverserial-prepare, adverserial-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Build attestation manifest from exact image digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_URL: https://verify.adverserial.ai/verify
        run: |
          set -euo pipefail
          mkdir digests
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'digest-*.txt' --dir digests
          test "$(find digests -type f | wc -l | tr -d ' ')" = 7
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          refs=sorted(p.read_text().strip() for p in Path('digests').glob('digest-*.txt'))
          if len(refs) != 7 or any('@sha256:' not in ref for ref in refs):
              raise SystemExit('invalid image digest set')
          ident=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/.github/workflows/release.yml@{os.environ['GITHUB_REF']}"
          data={'schema':'adverserial.agent-release/v1','product':'Decepticon','version':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'images':refs,'platform':'linux/amd64','attestation':{'verifier_url':os.environ['VERIFIER_URL'],'cosign_oidc_issuer':'https://token.actions.githubusercontent.com','cosign_certificate_identity':ident}}
          Path('decepticon-release.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          Path('decepticon-images.env').write_text('\n'.join('DECEPTICON_'+ref.rsplit('/',1)[-1].split('@',1)[0].upper().replace('-','_')+'_IMAGE='+ref for ref in refs)+'\n')
          PY
          sha256sum decepticon-release.json decepticon-images.env > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" decepticon-release.json decepticon-images.env SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
